<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Game Launcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        'primary-dark': '#4f46e5',
                        secondary: '#8b5cf6',
                    },
                    fontFamily: {
                        display: ['Orbitron', 'monospace'],
                    },
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body class="bg-neutral-900 text-neutral-100 font-sans">
    <div id="app" class="min-h-screen flex">
        <!-- Sidebar -->
        <nav class="w-64 bg-neutral-800 p-6">
            <h1 class="text-2xl font-display font-bold text-primary mb-8">Retro Launcher</h1>
            <ul class="space-y-2">
                <li><a href="#games" class="nav-link block p-3 rounded hover:bg-neutral-700 transition-colors">Games</a></li>
                <li><a href="#platforms" class="nav-link block p-3 rounded hover:bg-neutral-700 transition-colors">Platforms</a></li>
                <li><a href="#emulators" class="nav-link block p-3 rounded hover:bg-neutral-700 transition-colors">Emulators</a></li>
                <li><a href="#scan" class="nav-link block p-3 rounded hover:bg-neutral-700 transition-colors">Scan ROMs</a></li>
                <li><a href="#settings" class="nav-link block p-3 rounded hover:bg-neutral-700 transition-colors">Settings</a></li>
                <li><a href="#tags" class="nav-link block p-3 rounded hover:bg-neutral-700 transition-colors">Tags</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="flex-1 p-8">
            <!-- Games View -->
            <div id="games-view" class="view">
                <h2 class="text-4xl font-display font-bold mb-6">Games Library</h2>
                <div class="mb-6">
                    <button id="add-game-btn" class="bg-primary hover:bg-primary-dark px-4 py-2 rounded font-semibold transition-colors">
                        + Add Game
                    </button>
                </div>
                <div id="games-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    <!-- Games will be loaded here -->
                </div>
            </div>

            <!-- Platforms View -->
            <div id="platforms-view" class="view hidden">
                <h2 class="text-4xl font-display font-bold mb-6">Platforms</h2>
                <div class="mb-6">
                    <button id="add-platform-btn" class="bg-primary hover:bg-primary-dark px-4 py-2 rounded font-semibold transition-colors">
                        + Add Platform
                    </button>
                </div>
                <div id="platforms-list" class="space-y-4">
                    <!-- Platforms will be loaded here -->
                </div>
            </div>

            <!-- Emulators View -->
            <div id="emulators-view" class="view hidden">
                <h2 class="text-4xl font-display font-bold mb-6">Emulators</h2>
                <div class="mb-6">
                    <button id="add-emulator-btn" class="bg-primary hover:bg-primary-dark px-4 py-2 rounded font-semibold transition-colors">
                        + Add Emulator
                    </button>
                </div>
                <div id="emulators-list" class="space-y-4">
                    <!-- Emulators will be loaded here -->
                </div>
            </div>

            <!-- Scan ROMs View -->
            <div id="scan-view" class="view hidden">
                <h2 class="text-4xl font-display font-bold mb-6">Scan ROMs</h2>
                <p class="text-neutral-400 mb-6">Select a platform, then a folder to scan for ROM files.</p>
                
                <div class="flex items-center space-x-4 mb-6">
                    <div class="flex-1">
                        <label for="scan-platform-select" class="block text-sm font-medium mb-2">Platform</label>
                        <select id="scan-platform-select" class="w-full p-3 bg-neutral-800 border border-neutral-700 rounded">
                            <option value="">-- Select a Platform --</option>
                        </select>
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-medium mb-2">Folder</label>
                        <button id="scan-folder-btn" class="w-full bg-secondary hover:bg-purple-600 px-4 py-3 rounded font-semibold transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                            Select Folder to Scan
                        </button>
                    </div>
                </div>

                <div id="scan-pipeline" class="hidden">
                    <div class="flex items-center space-x-2 mb-4">
                        <button id="get-suggestions-btn" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded font-semibold transition-colors">
                            Get Suggestions
                        </button>
                        <button id="enrich-selected-btn" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded font-semibold transition-colors">
                            Enrich Selected
                        </button>
                        <button id="import-selected-btn" class="bg-primary hover:bg-primary-dark px-4 py-2 rounded font-semibold transition-colors">
                            Import Selected
                        </button>
                    </div>

                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-neutral-800">
                                <th class="p-3"><input type="checkbox" id="select-all-roms"></th>
                                <th class="p-3">Original Filename</th>
                                <th class="p-3">Suggested Title</th>
                                <th class="p-3">Status</th>
                                <th class="p-3">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="roms-table-body">
                            <!-- ROMs will be dynamically inserted here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Settings View -->
            <div id="settings-view" class="view hidden">
                <h2 class="text-4xl font-display font-bold mb-6">Settings</h2>
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium mb-2">TheGamesDB API Key</label>
                        <input type="text" id="thegamesdb-key" class="w-full p-3 bg-neutral-800 border border-neutral-700 rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">RAWG API Key</label>
                        <input type="text" id="rawg-key" class="w-full p-3 bg-neutral-800 border border-neutral-700 rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Gemini API Key</label>
                        <input type="text" id="gemini-key" class="w-full p-3 bg-neutral-800 border border-neutral-700 rounded">
                    </div>
                    <button id="save-settings-btn" class="bg-primary hover:bg-primary-dark px-4 py-2 rounded font-semibold transition-colors">
                        Save Settings
                    </button>
                </div>
            </div>

            <!-- Tags View -->
            <div id="tags-view" class="view hidden">
                <h2 class="text-4xl font-display font-bold mb-6">Tags</h2>
                <div class="mb-6">
                    <input type="text" id="new-tag-input" class="p-3 bg-neutral-800 border border-neutral-700 rounded" placeholder="New tag...">
                    <button id="add-tag-btn" class="bg-primary hover:bg-primary-dark px-4 py-2 rounded font-semibold transition-colors">
                        + Add Tag
                    </button>
                </div>
                <div id="tags-list" class="space-y-4">
                    <!-- Tags will be loaded here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <h3 id="modal-title" class="text-2xl font-bold mb-4"></h3>
            <form id="modal-form">
                <div id="modal-fields"></div>
                <div class="flex justify-end space-x-2 mt-4">
                    <button type="button" id="modal-cancel" class="bg-neutral-700 hover:bg-neutral-600 px-4 py-2 rounded">Cancel</button>
                    <button type="submit" id="modal-save" class="bg-primary hover:bg-primary-dark px-4 py-2 rounded">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
